# Test Configuration

# Database - Use H2 in-memory for testing
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import-test.sql

# Disable Flyway for tests (we use Hibernate schema generation instead)
quarkus.flyway.migrate-at-start=false

# HTTP
quarkus.http.test-port=8081

# Logging
quarkus.log.level=INFO
quarkus.log.category."se.konstlotteriet".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# JWT Configuration for tests
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=https://konstlotteriet.se
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Disable dev services for tests
quarkus.datasource.devservices.enabled=false

# Disable unnecessary features for tests
quarkus.swagger-ui.always-include=false
