# Datasource configuration
quarkus.datasource.db-kind=postgresql
# DevServices will provide the connection details automatically
# quarkus.datasource.username=konstlotteriet
# quarkus.datasource.password=konstlotteriet
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/konstlotteriet

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# HTTP configuration
quarkus.http.port=8080
# CORS Configuration
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."se.konstlotteriet".level=DEBUG

# OpenAPI / Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Dev services (for development - will start PostgreSQL in Docker automatically)
quarkus.datasource.devservices.enabled=true

# JWT/Security configuration
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=https://konstlotteriet.se
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Mailer configuration
# Development mode - use mock mailer (emails logged to console)
quarkus.mailer.mock=true
quarkus.mailer.from=noreply@konstlotteriet.se

# Production SMTP configuration (uncomment and configure for production)
# quarkus.mailer.mock=false
# quarkus.mailer.host=smtp.gmail.com
# quarkus.mailer.port=587
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=your-email@gmail.com
# quarkus.mailer.password=your-app-password
# quarkus.mailer.from=noreply@konstlotteriet.se

# Alternative: Using SendGrid
# quarkus.mailer.host=smtp.sendgrid.net
# quarkus.mailer.port=587
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=apikey
# quarkus.mailer.password=your-sendgrid-api-key

# Alternative: Using Mailgun
# quarkus.mailer.host=smtp.mailgun.org
# quarkus.mailer.port=587
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=your-mailgun-username
# quarkus.mailer.password=your-mailgun-password
