services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: konstlotteriet-db
    environment:
      POSTGRES_DB: konstlotteriet
      POSTGRES_USER: konstlotteriet
      POSTGRES_PASSWORD: konstlotteriet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konstlotteriet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - konstlotteriet-network

  # Backend (Quarkus)
  backend:
    build:
      context: ./konstlotteriet
      dockerfile: Dockerfile
    container_name: konstlotteriet-backend
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/konstlotteriet
      QUARKUS_DATASOURCE_USERNAME: konstlotteriet
      QUARKUS_DATASOURCE_PASSWORD: konstlotteriet_password
      QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000,http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - konstlotteriet-network

  # Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: ./konstlotteriet-frontend
      dockerfile: Dockerfile
    container_name: konstlotteriet-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - konstlotteriet-network

volumes:
  postgres-data:

networks:
  konstlotteriet-network:
    driver: bridge